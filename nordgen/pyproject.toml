[build-system]
requires = ["setuptools>=82,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "nord-config-generator"
version = "2.0.1"
authors = [
  { name = "Ahmed Touhami", email = "mustafachyi272@gmail.com" },
]
description = "Generate validated, optimized NordVPN WireGuard configurations."
readme = { file = "README.md", content-type = "text/markdown" }
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.14.3,<4",
  "rich>=15,<16",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
]
dev = [
  "build>=1.5,<2",
  "mypy>=2.3,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.16.1,<0.17",
  "twine>=7,<8",
]

[project.urls]
Homepage = "https://github.com/mustafachyi/NordVPN-WireGuard-Config-Generator"
Issues = "https://github.com/mustafachyi/NordVPN-WireGuard-Config-Generator/issues"
Source = "https://github.com/mustafachyi/NordVPN-WireGuard-Config-Generator"

[project.scripts]
nordgen = "nord_config_generator.main:cli_entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nord_config_generator = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
  "--cov=nord_config_generator",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nord_config_generator"]
omit = [
  "src/nord_config_generator/__main__.py",
  "src/nord_config_generator/permissions_windows.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false